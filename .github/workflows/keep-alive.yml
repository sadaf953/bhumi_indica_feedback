name: Supabase Keep Alive

# Free Supabase projects pause after ~7 days without traffic. This pings the
# database every day. It calls the public ping() function (the anon key has no
# access to the feedback table itself, by design).
#
# Secrets: SUPABASE_URL, SUPABASE_ANON_KEY

on:
  schedule:
    - cron: '0 3 * * *'  # every day, 8:30 AM IST
  workflow_dispatch:     # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase to prevent pause
        run: |
          echo "Pinging Supabase at $(date -u)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}')
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase ping returned $STATUS - check your secrets or project status."
            exit 1
          fi
          echo "Supabase is alive ✅"
